spring.application.name=finance-app-backend

spring.datasource.url=jdbc:mysql://localhost:3306/finance_app?useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true

spring.profiles.active=dev

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=http://localhost:8080
# app.jwt.issuer=https://api.financeapp.com
app.jwt.access-token-expiration-seconds=900
app.jwt.refresh-token-expiration-seconds=2592000
